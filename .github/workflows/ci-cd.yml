name: 🚀 CI/CD Pipeline

# Kích hoạt workflow khi:
on:
  push:
    branches: [ main, develop ]  # Khi push lên main hoặc develop
  pull_request:
    branches: [ main, develop ]   # Khi tạo Pull Request
  
# Cho phép chạy manual từ GitHub UI
  workflow_dispatch:

# Environment variables
env:
  REGISTRY: ghcr.io
  DOCKER_USERNAME: ${{ github.actor }}

jobs:
  # ─────────────────────────────────────────────
  # 1️⃣ BACKEND: Build & Test Java
  # ─────────────────────────────────────────────
  backend-build-test:
    name: 🏗️ Backend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Build Backend
        run: |
          cd GarageGo-BEJava
          mvn clean package -DskipTests
        continue-on-error: false

      - name: 🧪 Run Backend Tests
        run: |
          cd GarageGo-BEJava
          mvn test
        continue-on-error: true  # Không stop workflow nếu test fail

      - name: 📊 Upload Backend Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: GarageGo-BEJava/target/
          retention-days: 5

  # ─────────────────────────────────────────────
  # 2️⃣ FRONTEND: Build & Test React
  # ─────────────────────────────────────────────
  frontend-build-test:
    name: ⚛️ Frontend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📱 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'GarageGo-FE/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        run: |
          cd GarageGo-FE
          npm ci  # Sạch hơn npm install

      - name: 🔍 Run ESLint
        run: |
          cd GarageGo-FE
          npm run lint
        continue-on-error: true

      - name: 🔨 Build Frontend
        run: |
          cd GarageGo-FE
          npm run build

      - name: 🧪 Run Frontend Tests
        run: |
          cd GarageGo-FE
          npm test -- --coverage --watchAll=false
        continue-on-error: true

      - name: 📊 Upload Frontend Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: GarageGo-FE/build/
          retention-days: 5

  # ─────────────────────────────────────────────
  # 3️⃣ DOCKER: Build & Push Images
  # ─────────────────────────────────────────────
  docker-build-push:
    name: 🐳 Docker - Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]  # Chạy sau backend & frontend
    
    # Chỉ chạy khi push lên main (không chạy cho PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./GarageGo-BEJava
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./GarageGo-FE
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 4️⃣ NOTIFICATION: Thông báo kết quả
  # ─────────────────────────────────────────────
  notification:
    name: 📢 Send Notification
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test, docker-build-push]
    
    if: always()  # Luôn chạy, dù job nào fail

    steps:
      - name: ✅ Job Success
        if: success()
        run: |
          echo "🎉 CI/CD Pipeline thành công!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: ❌ Job Failure
        if: failure()
        run: |
          echo "💥 CI/CD Pipeline thất bại!"
          echo "Branch: ${{ github.ref }}"
          echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
