# =============================================
# DOCKER PROFILE — dùng khi chạy trong container
# Ghi đè các giá trị trong application.properties
# =============================================

# Database — kết nối đến container mysql (tên service trong docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/GaraOToManagement?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}

# Redis — bật lại khi chạy Docker (có container redis)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms

# Spring Cache — dùng Redis trong Docker
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000

# Logging — giảm verbose trong production
logging.level.com.garagego=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.redis=WARN
