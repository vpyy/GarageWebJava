# Server
server.port=5102

# Database — dùng env var trong production: DB_PASSWORD=xxx
spring.datasource.url=jdbc:mysql://localhost:3306/GaraOToManagement?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# Jackson - camelCase output
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
# Disable polymorphic type handling (@class field)
spring.jackson.default-typing=none

# Logging
logging.level.com.garagego=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.redis=DEBUG

# Springdoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# -----------------------------------------------
# JWT — QUAN TRỌNG: đổi jwt.secret trong production!
# Generate bằng: openssl rand -base64 32
# -----------------------------------------------
jwt.secret=${JWT_SECRET:bXlTZWNyZXRLZXlGb3JHYXJhZ2VHb0FwcGxpY2F0aW9u}
# Access token: 24 giờ (ms) - đủ dùng cho development
jwt.expiration-ms=86400000
# Refresh token: 7 ngày (ms)
jwt.refresh-expiration-ms=604800000

# -----------------------------------------------
# Redis - TẮT ĐỂ CHẠY LOCAL
